[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-hive-code-review"
version = "0.1.0"
description = "A local-first, read-only heuristic reviewer for GitHub pull request diffs."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
axiom-review = "axiom_hive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
